<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta importante...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6; /* Un tono rosado/romántico */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* Evita que salgan barras de desplazamiento cuando el botón se mueva */
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff4d4d;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            margin: 10px;
        }

        #btn-si {
            background-color: #ff4d4d;
            color: white;
        }

        #btn-si:hover {
            transform: scale(1.1);
        }

        #btn-no {
            background-color: #e0e0e0;
            color: #333;
            position: relative; /* Necesario para que cambie a absolute mediante JS */
        }

        /* Estilos para el formulario que aparece después */
        #formulario {
            display: none; /* Oculto al inicio */
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        #btn-enviar {
            background-color: #4CAF50;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla 1: La Pregunta -->
    <div class="container" id="pantalla-pregunta">
        <h1>¿Quieres salir el sábado en la noche conmigo?</h1>
        <button id="btn-si" class="btn">Sí</button>
        <button id="btn-no" class="btn">No</button>
    </div>

    <!-- Pantalla 2: El Formulario -->
    <div class="container" id="formulario">
        <h1>¡Perfecto! Sabía que dirías que sí ❤️</h1>
        <p style="color: #666; margin-bottom: 20px;">Deja tus datos para agendar nuestra cita:</p>
        
        <div class="form-group">
            <label for="hora">¿A qué hora paso por ti?</label>
            <input type="time" id="hora" required>
        </div>

        <div class="form-group">
            <label for="direccion">¿Cuál es la dirección?</label>
            <input type="text" id="direccion" placeholder="Ej: Calle falsa 123..." required>
        </div>

        <button id="btn-enviar" class="btn">Confirmar cita</button>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnSi = document.getElementById('btn-si');
        const pantallaPregunta = document.getElementById('pantalla-pregunta');
        const formulario = document.getElementById('formulario');
        const btnEnviar = document.getElementById('btn-enviar');

        // Función para mover el botón "No"
        const esquivarBoton = () => {
            // Cambiamos la posición a absoluta para moverlo libremente por la pantalla
            btnNo.style.position = 'absolute';
            
            // Calculamos posiciones aleatorias dentro del tamaño de la ventana
            const randomX = Math.floor(Math.random() * (window.innerWidth - btnNo.clientWidth));
            const randomY = Math.floor(Math.random() * (window.innerHeight - btnNo.clientHeight));
            
            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        };

        // Escuchar cuando intente hacer hover (computadora) o tocar (celular) el botón "No"
        btnNo.addEventListener('mouseover', esquivarBoton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Evita que se haga clic accidentalmente en móviles
            esquivarBoton();
        });

        // Evento cuando dice que "Sí"
        btnSi.addEventListener('click', () => {
            pantallaPregunta.style.display = 'none'; // Oculta la pregunta
            formulario.style.display = 'block'; // Muestra el formulario
        });

        // Evento final de confirmación
        btnEnviar.addEventListener('click', () => {
            const hora = document.getElementById('hora').value;
            const direccion = document.getElementById('direccion').value;

            if(hora === '' || direccion === '') {
                alert('¡Por favor llena la hora y la dirección!');
            } else {
                alert(`¡Cita agendada! Nos vemos a las ${hora} en ${direccion}. ❤️`);
            }
        });
    </script>

</body>
</html>
